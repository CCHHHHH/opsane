name: Quality Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: shell_agent/web/frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Install frontend dependencies
        run: npm ci --prefix shell_agent/web/frontend
      - name: Install isolated browser runtime
        run: npx --prefix shell_agent/web/frontend playwright install --with-deps chromium
      - name: Run complete quality gate
        env:
          PYTHON: python
        run: bash scripts/quality.sh
